name: fix-descriptions
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install numpy pillow pyshp google-api-python-client google-auth google-auth-oauthlib
      - run: python automation/fix_descriptions.py
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
