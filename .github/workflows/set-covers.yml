name: set-covers
# Run after the channel is phone-verified: sets the stored covers on all uploaded videos.
on: workflow_dispatch
jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install google-api-python-client google-auth google-auth-oauthlib
      - run: python automation/set_covers.py
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
