name: fetch-hist4
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/fetch_hist4.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/cencounts || true
          git commit -m "County counts 1900-1990 (Census text files)" && git pull --rebase -q && git push || echo nothing
