name: fetch-statehood
# U.S. Senate "States in the Senate" pages (federal, public domain): admission date and order of every state -> data/statehood/senate_pages.txt
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data/statehood
          python3 - <<'EOF'
          import html, re, time, urllib.request
          ST = "AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY".split()
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"})
              t = urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "replace")
              t = re.sub(r"(?s)<(script|style).*?</\1>", "", t)
              return re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", t)))
          out = open("data/statehood/senate_pages.txt", "w", encoding="utf-8")
          for ab in ST:
              url = f"https://www.senate.gov/states/{ab}/intro.htm"
              try:
                  t = get(url)
                  sents = [m.group(0).strip() for m in re.finditer(r"[^.]{0,260}\b(\d+(st|nd|rd|th)|first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|eleventh|twelfth|thirteenth)\b[^.]{0,40}\bstate\b[^.]{0,200}\.", t, re.I)]
                  out.write(f"== {ab} {url}\n" + "\n".join(sents[:4]) + "\n")
                  print(ab, len(sents))
              except Exception as e:
                  out.write(f"== {ab} {url}\nERROR {e}\n"); print(ab, "ERROR", e)
              time.sleep(1)
          for url in ("https://www.senate.gov/general/privacy.htm", "https://www.senate.gov/general/disclaimer.htm"):
              try:
                  t = get(url)
                  hits = [m.group(0) for m in re.finditer(r"[^.]{0,300}(public domain|copyright)[^.]{0,300}\.", t, re.I)]
                  out.write(f"== POLICY {url}\n" + "\n".join(hits[:6]) + "\n")
              except Exception as e:
                  out.write(f"== POLICY {url}\nERROR {e}\n")
          EOF
          cat data/statehood/senate_pages.txt | head -40
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/statehood && git commit -m "Senate statehood pages" && git pull --rebase && git push
