name: video
on:
  workflow_dispatch:
    inputs:
      crf:
        description: "x264 CRF"
        default: "22"
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seg: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install numpy pillow pyshp
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Render segment
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from mapviz import video as V
          k = ${{ matrix.seg }}; n = 6
          a = V.TOTAL_FRAMES * k // n; b = V.TOTAL_FRAMES * (k + 1) // n
          print("frames", a, b)
          sys.exit(V.render_range(a, b, f"seg{k}.mp4", crf=int("${{ inputs.crf }}")))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: seg${{ matrix.seg }}, path: seg${{ matrix.seg }}.mp4, retention-days: 3}
  assemble:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - uses: actions/download-artifact@v4
        with: {pattern: "seg*", merge-multiple: true}
      - name: Concat + music
        run: |
          for k in 0 1 2 3 4 5; do echo "file 'seg$k.mp4'"; done > list.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -c copy video_only.mp4
          M=assets/music
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 video_only.mp4)
          ffmpeg -y -loglevel error -i video_only.mp4 -i $M/oga-eclipse-legion.mp3 -i $M/oga-inevitable.mp3 -i $M/oga-the-ancient-legend.mp3 \
            -filter_complex "[1:a][2:a]acrossfade=d=4[a12];[a12][3:a]acrossfade=d=4[a123];[a123]atrim=0:$D,loudnorm=I=-16:TP=-1.5:LRA=11,afade=t=out:st=$(python3 -c "print($D-6)"):d=6[aout]" \
            -map 0:v -map "[aout]" -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart \
            america-over-time_us-population_1790-2020.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,duration:format=duration,size -of default=nw=1 america-over-time_us-population_1790-2020.mp4 | tee probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            america-over-time_us-population_1790-2020.mp4
            probe.txt
          retention-days: 7
