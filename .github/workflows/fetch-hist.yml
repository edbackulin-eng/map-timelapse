name: fetch-hist
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: bash scripts/fetch_hist.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/hist && git commit -m "Historical Census documents" && git pull --rebase -q && git push
